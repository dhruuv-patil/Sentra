name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy app core data

      - name: Run Pytest with Coverage Threshold (>= 70%)
        env:
          ENCRYPTION_KEY: "aY-i1BFk65ZKOn8G1uRc_h6378Hqw86niaeqmZlg-Sc="
          SECRET_KEY: "dbeca5a1-66bf-4254-9aa4-f6d99e9eb62d"
          AIRGAPPED_MODE: "false"
        run: |
          pytest --cov=core --cov=app --cov=data --cov-fail-under=70

      - name: Run Fast Evaluation Smoke Test Quality Gate
        run: |
          python eval/eval_smoke_test.py

  docker-build:
    needs: lint-test-and-eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        run: |
          docker build -t sentra:latest .

      - name: Verify Container Self-Check
        run: |
          docker run --rm sentra:latest python -c "
          import core.security.input_guards
          import core.security.detectors
          import data.repository
          print('Docker gateway container verified successfully.')
          "
