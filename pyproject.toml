[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-gateway"
version = "2.0.0"
description = "A robust, middleware-based security gateway and observability suite for Large Language Models."
readme = "README.md"
authors = [
    { name = "Dhruv Patil", email = "dhruvpatil61105@email.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "security", "guardrails", "fastapi", "ai-safety", "prompt-injection", "pii-redaction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "cryptography",
    "pydantic",
    "websockets",
    "python-dotenv",
    "jinja2",
    "streamlit",
    "pandas",
    "plotly",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests",
]

[project.urls]
"Homepage" = "https://github.com/dhruuv-patil/llm-security-gateway"
"Repository" = "https://github.com/dhruuv-patil/llm-security-gateway.git"
"Bug Tracker" = "https://github.com/dhruuv-patil/llm-security-gateway/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "frontend",
    "eval/data",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length
    "B008",  # fastapi Depends in function signatures
    "E402",  # module level import not at top of file (used in eval/sys.path scripts)
    "E701",  # multiple statements on one line
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "^frontend/",
    "^\\.venv/",
    "^eval/data/"
]

[tool.coverage.run]
source = ["app", "core", "data"]
omit = [
    "app/dashboard/*",
    "tests/*",
    "eval/*",
    "frontend/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
