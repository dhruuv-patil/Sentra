<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Security Gateway Pro</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="app-container">
        <!-- Left Pane: Chat Interface -->
        <div class="chat-pane">
            <header class="chat-header">
                <div class="brand">
                    <span class="shield-icon">🛡️</span>
                    <h1>Gateway Pro Interface</h1>
                </div>
                <div class="header-actions">
                    <div class="model-selector">
                        <label for="model-select">Model:</label>
                        <select id="model-select" class="premium-select">
                            <option value="groq/llama-3.3-70b-versatile">Groq - Llama 3.3 70B</option>
                        </select>
                    </div>
                    <a href="https://github.com/dhruuv-patil/llm-security-gateway" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub: dhruuv-patil/llm-security-gateway">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                    </a>
                </div>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="welcome-message">
                    <h3>Secure LLM Endpoint</h3>
                    <p>All interactions are evaluated by real-time security guards.</p>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea id="prompt-input" placeholder="Type a message... (Press Enter to send)" rows="1"></textarea>
                <button id="send-btn" class="primary-btn">
                    <span>Send</span>
                </button>
            </div>
        </div>

        <!-- Right Pane: Live Gateway Logs -->
        <div class="log-pane">
            <header class="log-header">
                <h2><span class="live-dot"></span> Live Gateway Activity</h2>
                <button id="clear-logs-btn" class="icon-btn" title="Clear Logs">🗑️</button>
            </header>

            <div class="log-stream" id="log-stream">
                <!-- Log cards will be injected here dynamically -->
                <div class="log-card system-log">
                    <div class="log-time">System</div>
                    <div class="log-content">Waiting for connection to Gateway...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
